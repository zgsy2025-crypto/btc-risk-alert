name: Price Change Alert

on:
  workflow_dispatch:
    inputs:
      threshold_5m:
        description: "5-minute move threshold percent"
        required: true
        default: "1.5"
      threshold_15m:
        description: "15-minute move threshold percent"
        required: true
        default: "2.5"
      threshold_1h:
        description: "1-hour move threshold percent"
        required: true
        default: "4.0"
      volume_multiplier:
        description: "Volume spike multiplier threshold"
        required: true
        default: "3.0"
      notify_no_alert:
        description: "Send Telegram message even when no risk threshold is crossed"
        required: true
        default: "true"

jobs:
  price-change-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check BTC price-change risk
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BTC_ALERT_CURRENCY: "usd"
          BTC_ALERT_THRESHOLD_5M: ${{ inputs.threshold_5m }}
          BTC_ALERT_THRESHOLD_15M: ${{ inputs.threshold_15m }}
          BTC_ALERT_THRESHOLD_1H: ${{ inputs.threshold_1h }}
          BTC_ALERT_VOLUME_MULTIPLIER: ${{ inputs.volume_multiplier }}
          BTC_ALERT_NOTIFY_NO_ALERT: ${{ inputs.notify_no_alert }}
        run: python scripts/price_change_alert.py
