name: Price Change Alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      threshold_5m:
        description: "5-minute move threshold percent"
        required: true
        default: "1.5"
      threshold_15m:
        description: "15-minute move threshold percent"
        required: true
        default: "2.5"
      threshold_1h:
        description: "1-hour move threshold percent"
        required: true
        default: "4.0"
      volume_multiplier:
        description: "Volume spike multiplier threshold"
        required: true
        default: "3.0"
      rsi_overbought:
        description: "RSI overbought warning threshold"
        required: true
        default: "70"
      rsi_oversold:
        description: "RSI oversold warning threshold"
        required: true
        default: "30"
      notify_no_alert:
        description: "Send Telegram message even when no risk threshold is crossed"
        required: true
        default: "true"

jobs:
  price-change-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check BTC price-change risk
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BTC_ALERT_CURRENCY: "usd"
          BTC_ALERT_THRESHOLD_5M: ${{ github.event.inputs.threshold_5m || '1.5' }}
          BTC_ALERT_THRESHOLD_15M: ${{ github.event.inputs.threshold_15m || '2.5' }}
          BTC_ALERT_THRESHOLD_1H: ${{ github.event.inputs.threshold_1h || '4.0' }}
          BTC_ALERT_VOLUME_MULTIPLIER: ${{ github.event.inputs.volume_multiplier || '3.0' }}
          BTC_ALERT_RSI_OVERBOUGHT: ${{ github.event.inputs.rsi_overbought || '70' }}
          BTC_ALERT_RSI_OVERSOLD: ${{ github.event.inputs.rsi_oversold || '30' }}
          BTC_ALERT_NOTIFY_NO_ALERT: ${{ github.event.inputs.notify_no_alert || 'true' }}
        run: python scripts/price_change_alert.py
