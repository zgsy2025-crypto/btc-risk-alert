name: BTC API Probe

on:
  workflow_dispatch:

jobs:
  coingecko-api-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe CoinGecko BTC market data
        run: python scripts/api_probe.py
